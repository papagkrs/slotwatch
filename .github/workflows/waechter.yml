# SlotWatch Wächter — STILLGELEGT am 14.08.2026.
# Grund: Telegram-Knopfdrücke (callback_query) kamen nie über getUpdates an,
# und GitHub drosselte den 5-Minuten-Zeitplan auf ~1x pro Stunde.
# Die Knöpfe laufen jetzt über erledigt.html (Link-Knöpfe, sofortige Reaktion, ohne Server).
# Bei Bedarf manuell startbar (workflow_dispatch); der Zeitplan ist absichtlich entfernt.
name: Telegram Wächter

on:
  workflow_dispatch:         # nur noch manueller Start über die GitHub-Webseite

permissions:
  contents: write

concurrency:
  group: waechter
  cancel-in-progress: false

jobs:
  waechter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wächter ausführen
        run: node waechter/waechter.js

      - name: Logbuch speichern (nur wenn geändert)
        run: |
          if ! git diff --quiet waechter/meldungen.json; then
            git config user.name "SlotWatch Waechter"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add waechter/meldungen.json
            git commit -m "🤖 Wächter: Logbuch aktualisiert"
            git pull --rebase
            git push
          fi
